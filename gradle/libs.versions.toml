[versions]
palantir = "2.102.0"
spotless = "8.10.4"
shadow = "9.6.1"

cjda-util = "2.15.0+jda-6.3.0"
jgit = "7.8.0.202609011348-r"
jackson = "2.22.4"
postgresql = "42.7.14"
sadu = "2.4.0"
log4j = "2.26.1"
slf4j = "2.0.20"
log-util = "1.0.1"
jetbrains-annotations = "26.1.0"

junit = "6.1.3"

[libraries]
cjda-util = { module = "de.chojo:cjda-util", version.ref = "cjda-util" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
sadu-queries = { module = "de.chojo.sadu:sadu-queries", version.ref = "sadu" }
sadu-updater = { module = "de.chojo.sadu:sadu-updater", version.ref = "sadu" }
sadu-postgresql = { module = "de.chojo.sadu:sadu-postgresql", version.ref = "sadu" }
sadu-datasource = { module = "de.chojo.sadu:sadu-datasource", version.ref = "sadu" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2 = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
log4j-jsontemplate = { module = "org.apache.logging.log4j:log4j-layout-template-json", version.ref = "log4j" }
log-util = { module = "de.chojo:log-util", version.ref = "log-util" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
sadu = ["sadu-queries", "sadu-updater", "sadu-postgresql", "sadu-datasource"]
log4j = ["slf4j-api", "log4j-core", "log4j-slf4j2", "log4j-jsontemplate"]

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
